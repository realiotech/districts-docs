server {
  listen 8080;
  absolute_redirect off;

  location = / {
    return 302 /districts/;
  }

  # Legacy GitBook aliases. GitBook served these as 307s from paths that
  # predate the current structure, so links published before the migration
  # would break on cutover. Found by probing the GitBook site, since its
  # redirect table is not visible without admin access; the targets are the
  # ones GitBook itself resolved to.
  location = /districts/faqs {
    return 301 /districts/tutorials-and-faqs/video-library;
  }

  location ^~ /districts/faqs/ {
    rewrite ^/districts/faqs/(.*)$
      /districts/tutorials-and-faqs/frequently-asked-questions/$1 permanent;
  }

  location = /districts/video-library {
    return 301 /districts/branding-guidelines/districts-brand-kit/video-library;
  }

  location = /districts/how-do-i-delete-my-districts-account {
    return 301 /districts/tutorials-and-faqs/frequently-asked-questions/how-do-i-delete-my-districts-account;
  }

  location /districts/ {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /districts/index.html;
  }

  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}
